<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mist</title>

<style>
:root {
    --background: #343434;
    --sidebar: #292929;
    --sidebar-hover: #3b3b3b;
    --border: #474747;
    --text: #f5f5f5;
    --muted: #a5a5a5;
    --composer: #f1f1f1;
    --composer-text: #151515;
    --user-message: #484848;
    --code-background: #202020;
    --code-border: #4a4a4a;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: var(--background);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
textarea,
input {
    font-family: inherit;
}

.app {
    width: 100vw;
    height: 100vh;
    display: flex;
    overflow: hidden;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 270px;
    min-width: 270px;
    height: 100vh;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    transition:
        width .22s ease,
        min-width .22s ease;
    overflow: hidden;
    position: relative;
    z-index: 20;
}

.sidebar.collapsed {
    width: 0;
    min-width: 0;
    border-right: 0;
}

.sidebar-inner {
    width: 270px;
    height: 100%;
    padding: 13px 11px;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   MIST LOGO
========================================================= */

.brand {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    margin-bottom: 9px;
}

.mist-logo {
    width: 40px;
    height: 40px;
    display: block;
}

.mist-logo svg {
    width: 100%;
    height: 100%;
    display: block;
}

.mist-logo-shape {
    fill: none;
    stroke: #f5f5f5;
    stroke-width: 5.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================================================
   SIDEBAR BUTTONS
========================================================= */

.sidebar-button {
    width: 100%;
    min-height: 43px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
}

.sidebar-button:hover {
    background: var(--sidebar-hover);
}

.sidebar-icon {
    width: 21px;
    min-width: 21px;
    height: 21px;
    display: grid;
    place-items: center;
    color: #e8e8e8;
}

.sidebar-label {
    white-space: nowrap;
}

/* =========================================================
   CHAT LIST
========================================================= */

.chat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin-top: 17px;
    padding: 0 3px;
}

.chat-list-title {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 0 9px 8px;
}

.chat-row {
    width: 100%;
    display: flex;
    align-items: center;
    border-radius: 9px;
    margin-bottom: 2px;
}

.chat-row:hover {
    background: var(--sidebar-hover);
}

.chat-open {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 9px;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
    border-radius: 9px;
}

.delete-chat {
    width: 31px;
    height: 31px;
    margin-right: 3px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #999;
    cursor: pointer;
    opacity: 0;
    display: grid;
    place-items: center;
}

.chat-row:hover .delete-chat {
    opacity: 1;
}

.delete-chat:hover {
    background: #4c4c4c;
    color: white;
}

/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 9px;
    margin-top: 9px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--background);
    position: relative;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    width: 100%;
    height: 54px;
    min-height: 54px;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.menu-button {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
}

.menu-button:hover {
    background: #3d3d3d;
}

.menu-lines {
    width: 18px;
    height: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu-lines span {
    height: 1.5px;
    width: 100%;
    border-radius: 3px;
    background: #ddd;
}

/* =========================================================
   CHAT AREA
========================================================= */

.chat-area {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =========================================================
   WELCOME
========================================================= */

.welcome {
    width: min(680px, calc(100% - 40px));
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    text-align: center;
    transition:
        opacity .2s ease,
        transform .2s ease;
}

.welcome.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -45%);
}

.greeting {
    font-size: 27px;
    font-weight: 600;
    letter-spacing: -.025em;
    margin-bottom: 25px;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer {
    width: 100%;
    min-height: 52px;
    background: var(--composer);
    border-radius: 26px;
    display: flex;
    align-items: flex-end;
    padding: 7px 9px 7px 17px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.composer textarea {
    flex: 1;
    min-width: 0;
    min-height: 37px;
    max-height: 120px;
    padding: 7px 8px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--composer-text);
    resize: none;
    font-size: 15px;
    line-height: 22px;
}

.send-button {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border: 0;
    border-radius: 50%;
    background: #202020;
    color: white;
    display: grid;
    place-items: center;
    cursor: pointer;
}

.send-button:disabled {
    opacity: .35;
    cursor: default;
}

.send-button svg {
    width: 17px;
    height: 17px;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 20px 115px;
    display: none;
}

.messages.active {
    display: block;
}

.message-row {
    width: min(780px, 100%);
    margin: 0 auto 22px;
    display: flex;
    gap: 10px;
}

.message-row.user {
    justify-content: flex-end;
}

.message {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user {
    background: var(--user-message);
}

.message.assistant {
    padding-left: 0;
    background: transparent;
    max-width: 100%;
}

.assistant-logo {
    width: 28px;
    height: 28px;
    flex: none;
    margin-top: 2px;
}

.assistant-logo svg {
    width: 100%;
    height: 100%;
}

/* =========================================================
   CODE BLOCKS
========================================================= */

.code-block {
    width: 100%;
    max-width: 760px;
    margin: 13px 0 17px;
    border: 1px solid var(--code-border);
    border-radius: 11px;
    overflow: hidden;
    background: var(--code-background);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.code-header {
    height: 39px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #292929;
    border-bottom: 1px solid #414141;
}

.code-copy-button {
    position: absolute;
    left: 8px;
    top: 6px;
    height: 27px;
    border: 0;
    border-radius: 6px;
    padding: 0 9px;
    background: #3b3b3b;
    color: #cfcfcf;
    cursor: pointer;
    font-size: 11px;
}

.code-copy-button:hover {
    background: #4a4a4a;
    color: white;
}

.code-copy-button.copied {
    color: #fff;
    background: #505050;
}

.code-language {
    position: absolute;
    right: 10px;
    top: 0;
    height: 38px;
    display: flex;
    align-items: center;
    color: #a9a9a9;
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
}

.code-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
}

.code-spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid #666;
    border-top-color: #eee;
    animation: codeSpin .75s linear infinite;
}

@keyframes codeSpin {
    to {
        transform: rotate(360deg);
    }
}

.code-block.finished .code-spinner {
    display: none;
}

.code-content {
    margin: 0;
    padding: 14px 16px 16px;
    overflow-x: auto;
    color: #e5e5e5;
    font-family:
        "Cascadia Code",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre;
    tab-size: 4;
}

.code-content.typewriter-cursor::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 15px;
    margin-left: 2px;
    vertical-align: -2px;
    background: #bbb;
    animation: cursorBlink .5s infinite;
}

/* =========================================================
   THINKING
========================================================= */

.thinking-row {
    width: min(780px, 100%);
    margin: 0 auto 22px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
}

.thinking-logo {
    width: 28px;
    height: 28px;
    flex: none;
    margin-top: 2px;
}

.thinking-logo svg {
    width: 100%;
    height: 100%;
}

.thinking-content {
    min-width: 0;
    padding-top: 3px;
}

.thinking-label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #c5c5c5;
    font-size: 14px;
    line-height: 22px;
}

.thinking-dots {
    display: flex;
    align-items: center;
    gap: 3px;
}

.thinking-dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #aaa;
    animation: thinkingPulse 1.2s infinite ease-in-out;
}

.thinking-dots span:nth-child(2) {
    animation-delay: .15s;
}

.thinking-dots span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes thinkingPulse {
    0%,
    60%,
    100% {
        opacity: .35;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-2px);
    }
}

.thinking-status {
    color: #909090;
    font-size: 13px;
    line-height: 20px;
    margin-top: 2px;
    transition: opacity .15s ease;
}

/* =========================================================
   TYPEWRITER
========================================================= */

.typewriter-cursor::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 17px;
    margin-left: 2px;
    vertical-align: -3px;
    background: #bdbdbd;
    animation: cursorBlink .8s infinite;
}

@keyframes cursorBlink {
    0%,
    45% {
        opacity: 1;
    }

    46%,
    100% {
        opacity: 0;
    }
}

/* =========================================================
   BOTTOM COMPOSER
========================================================= */

.bottom-composer {
    display: none;
    width: min(780px, calc(100% - 36px));
    position: absolute;
    left: 50%;
    bottom: 17px;
    transform: translateX(-50%);
    z-index: 10;
}

.bottom-composer.active {
    display: block;
}

/* =========================================================
   OVERLAYS
========================================================= */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.56);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.overlay.visible {
    display: flex;
}

.modal {
    width: min(760px, calc(100% - 32px));
    max-height: calc(100vh - 40px);
    background: #303030;
    border: 1px solid #4b4b4b;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 20px 70px rgba(0,0,0,.45);
}

.tool-header {
    height: 55px;
    min-height: 55px;
    border-bottom: 1px solid #494949;
    padding: 0 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.tool-header h2 {
    margin: 0;
    font-size: 17px;
}

.close-button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #ddd;
    cursor: pointer;
    font-size: 16px;
}

.close-button:hover {
    background: #444;
}

/* =========================================================
   SEARCH
========================================================= */

.search-body {
    padding: 18px;
}

.search-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border: 1px solid #505050;
    border-radius: 10px;
    outline: 0;
    background: #252525;
    color: #eee;
    font-size: 14px;
}

.search-input:focus {
    border-color: #777;
}

.search-results {
    max-height: 430px;
    overflow-y: auto;
    margin-top: 14px;
}

.search-empty {
    color: #999;
    font-size: 14px;
    padding: 22px 5px;
    text-align: center;
}

.search-result {
    width: 100%;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #eee;
    padding: 12px;
    text-align: left;
    cursor: pointer;
    margin-bottom: 4px;
}

.search-result:hover {
    background: #3d3d3d;
}

.search-result-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 5px;
}

.search-result-preview {
    color: #999;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   NOTES
========================================================= */

.notes-modal {
    width: min(760px, calc(100% - 32px));
    height: min(650px, calc(100% - 40px));
    display: flex;
    flex-direction: column;
}

.notes-textarea {
    flex: 1;
    min-height: 0;
    border: 0;
    outline: 0;
    resize: none;
    background: #292929;
    color: #eee;
    padding: 20px;
    font-size: 15px;
    line-height: 1.65;
}

.notes-status {
    padding: 8px 18px;
    border-top: 1px solid #444;
    color: #888;
    font-size: 12px;
}

/* =========================================================
   STACK
========================================================= */

.stack-modal {
    width: min(1000px, calc(100% - 32px));
    height: min(760px, calc(100% - 32px));
    display: flex;
    flex-direction: column;
}

.stack-content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.stack-tabs {
    display: flex;
    gap: 5px;
    padding: 10px 12px;
    border-bottom: 1px solid #444;
}

.stack-tab {
    border: 0;
    background: transparent;
    color: #aaa;
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 13px;
}

.stack-tab:hover,
.stack-tab.active {
    background: #444;
    color: white;
}

.stack-editor-area {
    flex: 1;
    min-height: 0;
    padding: 12px;
}

.stack-editor {
    width: 100%;
    height: 100%;
    min-height: 250px;
    resize: none;
    border: 1px solid #494949;
    border-radius: 10px;
    background: #202020;
    color: #e8e8e8;
    padding: 14px;
    outline: none;
    font-family:
        "Cascadia Code",
        "SFMono-Regular",
        Consolas,
        monospace;
    font-size: 13px;
    line-height: 1.55;
}

.stack-editor:focus {
    border-color: #6a6a6a;
}

.stack-preview {
    display: none;
    width: 100%;
    height: 100%;
    min-height: 250px;
    border: 1px solid #494949;
    border-radius: 10px;
    background: white;
}

.stack-bottom {
    height: 55px;
    min-height: 55px;
    border-top: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
    gap: 8px;
}

.stack-button-action {
    border: 1px solid #555;
    background: #414141;
    color: white;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
}

.stack-button-action:hover {
    background: #4b4b4b;
}

/* =========================================================
   DELETE MODAL
========================================================= */

.delete-modal {
    width: min(450px, calc(100% - 32px));
    padding: 20px;
}

.delete-modal h2 {
    margin: 0 0 8px;
    font-size: 18px;
}

.delete-modal p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 20px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-button {
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid #555;
    background: #3e3e3e;
    color: white;
    cursor: pointer;
}

.modal-button:hover {
    background: #494949;
}

.modal-button.delete {
    background: #a83c3c;
    border-color: #b34b4b;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        box-shadow: 12px 0 40px rgba(0,0,0,.3);
    }

    .sidebar.collapsed {
        width: 0;
        min-width: 0;
    }

    .greeting {
        font-size: 24px;
    }

    .welcome {
        top: 43%;
    }

    .message {
        max-width: 86%;
    }

    .stack-modal {
        width: calc(100% - 16px);
        height: calc(100% - 16px);
    }

    .code-block {
        max-width: 100%;
    }
}

</style>
</head>

/* =========================================================
   PARSE RESPONSE
========================================================= */

function parseResponseParts(
text
) {

const parts = [];

const regex =
/```([^\n`]*)\n([\s\S]*?)```/g;


let lastIndex =
0;

let match;


while (
(
match =
regex.exec(
text
)
) !== null
) {

if (
match.index >
lastIndex
) {

parts.push({

type:
"text",

content:
text.slice(
lastIndex,
match.index
)

});

}


parts.push({

type:
"code",

language:
match[1]
.trim(),

content:
match[2]

});


lastIndex =
regex.lastIndex;

}


if (
lastIndex <
text.length
) {

parts.push({

type:
"text",

content:
text.slice(
lastIndex
)

});

}


return parts;

}

/* =========================================================
   VERY FAST CODE TYPEWRITER
========================================================= */

function typeCodeBlock(

block,

code

) {

return new Promise(

resolve => {

const content =
block.querySelector(
".code-content"
);


let index =
0;


/*
   Code is intentionally very fast.
   Larger chunks make long code blocks
   finish quickly.
*/

const interval =
setInterval(

() => {

if (
index >=
code.length
) {

clearInterval(
interval
);


content.classList.remove(
"typewriter-cursor"
);


block.classList.add(
"finished"
);


resolve();

return;

}


let chunkSize =
18;


if (
code.length <
250
) {

chunkSize =
8;

} else if (
code.length <
700
) {

chunkSize =
14;

}


content.textContent +=

code.slice(

index,

index +
chunkSize

);


index +=
chunkSize;


scrollMessages();

},

8

);

}

);

}


/* =========================================================
   TYPEWRITER NORMAL TEXT
========================================================= */

element,

text

) {

return new Promise(

resolve => {

let index =
0;


element.textContent =
"";

element.classList.add(
"typewriter-cursor"
);


const interval =
setInterval(

() => {

if (
index >=
text.length
) {

clearInterval(
interval
);

element.classList.remove(
"typewriter-cursor"
);

resolve();

return;

}


element.textContent +=
text.charAt(
index
);


index++;

scrollMessages();

},

12

);

}

);

}

},

],

temperature:
0.7

})

}

);


if (

) {

"The AI request failed.";

await response.json();


message =

data
?.error
?.message

||

message;

} catch {

}


throw new Error(
message
);

}


const data =
await response.json();


return (

data
?.choices
?.[0]
?.message
?.content

||

"I wasn't able to generate a response."

);

}

function renderSearchResults(

query

) {

const search =
query
.trim()
.toLowerCase();


if (
!search
) {

searchResults.innerHTML = `

<div class="search-empty">
Start typing to search your chats.
</div>

`;

return;

}


const results =

chats.filter(

chat => {

const title =

(
chat.title
||
""
)
.toLowerCase();


const messagesText =

(
chat.messages
||
[]
)
.map(

message =>
message.content
||
""

)
.join(
" "
)
.toLowerCase();


return (

title.includes(
search
)

||

messagesText.includes(
search
)

);

}

)
.reverse();


if (
results.length ===
0
) {

searchResults.innerHTML = `

<div class="search-empty">
No matching chats found.
</div>

`;

return;

}


searchResults.innerHTML =
"";


results.forEach(

chat => {

const button =
document.createElement(
"button"
);

button.className =
"search-result";


const title =
document.createElement(
"div"
);

title.className =
"search-result-title";

title.textContent =
chat.title
||
"New Chat";


const preview =
document.createElement(
"div"
);

preview.className =
"search-result-preview";


const lastMessage =

(
chat.messages
||
[]
)
.slice(
-1
)[0];


preview.textContent =

lastMessage
?.content

||

"No messages";


button.appendChild(
title
);

button.appendChild(
preview
);


button.addEventListener(

"click",

() => {

searchOverlay.classList.remove(
"visible"
);

openChat(
chat.id
);

}

);


searchResults.appendChild(
button
);

}

);

}

tab => {

"preview"
) {

switchStackLanguage(

);

function switchStackLanguage(

language

) {

currentStackLanguage =
language;


document
.querySelectorAll(
".stack-tab"
)
.forEach(

tab => {

tab.classList.toggle(

"active",

tab.dataset.language ===
language

);

}

);


stackEditor.style.display =
"block";

stackPreview.style.display =
"none";


stackEditor.value =

stackCode[
language
]
||
"";

}


stackEditor.addEventListener(

"input",

() => {

stackCode[
currentStackLanguage
] =
stackEditor.value;

}

);


function showStackPreview() {

stackCode.html =
stackEditor.value;


document
.querySelectorAll(
".stack-tab"
)
.forEach(

tab => {

tab.classList.toggle(

"active",

tab.dataset.language ===
"preview"

);

}

);

"none";

stackPreview.style.display =
"block";


stackPreview.srcdoc = `

${stackCode.css || ""}

</style>

</head>

${stackCode.html || ""}

<script>

${stackCode.js || ""}

</body>

</html>

`;

}

);

"";

] =
